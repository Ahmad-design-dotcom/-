<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الحضور والانصراف</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #333;
    }

    .container {
      max-width: 600px;
      width: 95%;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .greeting {
      font-size: 16px;
      font-weight: 600;
      color: #667eea;
    }

    .date-time {
      font-size: 13px;
      color: #666;
      text-align: center;
      flex-basis: 100%;
    }

    h1 {
      text-align: center;
      color: #fff;
      font-size: 28px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .salary-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .salary-label {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .salary-value {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
    }

    .buttons-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .buttons-container-full {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 15px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .btn-success {
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
    }

    .btn-danger {
      background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
    }

    .btn-info {
      background: linear-gradient(135deg, #2196f3 0%, #0b7dda 100%);
    }

    .btn-warning {
      background: linear-gradient(135deg, #ff9800 0%, #e68900 100%);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #607d8b 0%, #455a64 100%);
    }

    .btn-dark {
      background: linear-gradient(135deg, #424242 0%, #212121 100%);
    }

    .btn-home {
      background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
    }

    .table-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      background: #667eea;
      color: #fff;
      padding: 15px 10px;
      text-align: center;
      font-weight: 600;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e0e0e0;
      text-align: center;
    }

    tr:hover {
      background: #f5f5f5;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .summary-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .summary-label {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .summary-value {
      font-size: 32px;
      font-weight: 700;
      color: #4caf50;
      margin-bottom: 10px;
    }

    .summary-details {
      font-size: 12px;
      color: #999;
      line-height: 1.6;
    }

    .footer {
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      font-size: 12px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
        margin-bottom: 15px;
      }

      .header-content {
        flex-direction: column;
        gap: 10px;
      }

      .greeting {
        font-size: 14px;
      }

      .salary-value {
        font-size: 28px;
      }

      .btn {
        padding: 12px;
        font-size: 13px;
        min-height: 45px;
      }

      table {
        font-size: 11px;
      }

      th, td {
        padding: 8px 5px;
      }

      .summary-value {
        font-size: 28px;
      }
    }

    @media (max-width: 360px) {
      .container {
        padding: 15px;
      }

      .header {
        padding: 15px;
      }

      h1 {
        font-size: 20px;
      }

      .btn {
        padding: 10px;
        font-size: 12px;
        min-height: 42px;
      }

      .salary-value {
        font-size: 24px;
      }

      .summary-value {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <span class="greeting" id="greeting"></span>
        <span class="date-time" id="dateTime"></span>
      </div>
    </div>

    <h1>📌 نظام الحضور والانصراف</h1>

    <div class="salary-card">
      <div class="salary-label">💰 مرتبك الشهري</div>
      <div class="salary-value"><span id="userSalary"></span> جنيه</div>
    </div>

    <div class="buttons-container">
      <button class="btn btn-success" onclick="checkIn()">✅ حضور</button>
      <button class="btn btn-danger" onclick="checkOut()">⛔ انصراف</button>
      <button class="btn btn-info" onclick="addLeave('مدفوعة')">🎉 إجازة مدفوعة</button>
      <button class="btn btn-warning" onclick="addLeave('غير مدفوعة')">📅 إجازة بدون راتب</button>
    </div>

    <div class="buttons-container">
      <button class="btn btn-secondary" onclick="addLoan()">💳 إضافة سُلفة</button>
      <button class="btn btn-secondary" onclick="addDeduction()">📉 إضافة خصم</button>
    </div>

    <div class="buttons-container-full">
      <button class="btn btn-warning" onclick="resetMonth()">🔄 إعادة تسجيل الشهر</button>
    </div>

    <div class="table-container">
      <table id="attendanceTable">
        <tr>
          <th>التاريخ</th>
          <th>الدخول</th>
          <th>الخروج</th>
          <th>الساعات</th>
          <th>القيمة</th>
        </tr>
      </table>
    </div>

    <div class="summary-card">
      <div class="summary-label">📊 ملخص الراتب الشهري</div>
      <div class="summary-value" id="totalValue">0</div>
      <div class="summary-details" id="summaryDetails">الراتب: 0 جنيه<br>السُلف: 0 جنيه<br>الخصومات: 0 جنيه</div>
    </div>

    <div class="buttons-container-full">
      <button class="btn btn-dark" onclick="logout()">🚪 تسجيل الخروج</button>
      <button class="btn btn-home" onclick="window.location.href='index.html'">🏠 الصفحة الرئيسية</button>
    </div>

    <div class="footer">
      تم التطوير بواسطة: <strong>أحمد حاتم عبد العظيم</strong><br>
      📞 01102975929 – ✉️ ahmadhatem973@gmail.com
    </div>
  </div>

<script>
let currentUser = JSON.parse(localStorage.getItem("loggedUser"));
let records = JSON.parse(localStorage.getItem("attendance")) || [];
let checkInTime = null;
let paidLeaves = 0;
let checkedIn = false;

if (!currentUser) {
  alert("⚠️ لم يتم العثور على بيانات المستخدم، برجاء تسجيل الدخول أولًا!");
  window.location.href = "login.html";
}

document.getElementById("userSalary").innerText = currentUser.salary;

// تحديث التحية والوقت
function updateHeader() {
  let now = new Date();
  let days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  let greeting = now.getHours() < 12 ? "☀️ صباح الخير" : (now.getHours() < 17 ? "🌤️ بعد الظهر" : "🌙 مساء الخير");
  document.getElementById("greeting").innerText = greeting + " يا " + currentUser.name;
  document.getElementById("dateTime").innerText =
    `${days[now.getDay()]} - ${now.toLocaleDateString("ar-EG")} - ${now.toLocaleTimeString("ar-EG")}`;
}
updateHeader();
setInterval(updateHeader, 60000);

function saveData() {
  localStorage.setItem("attendance", JSON.stringify(records));
}

function checkIn() {
  if (checkedIn) { alert("❌ لازم تعمل انصراف قبل حضور جديد."); return; }
  checkInTime = new Date();
  checkedIn = true;
  alert("✅ حضور: " + checkInTime.toLocaleTimeString("ar-EG"));
}

function checkOut() {
  if (!checkedIn) { alert("❌ لازم تسجل حضور الأول."); return; }
  let checkOutTime = new Date();
  let hoursWorked = (checkOutTime - checkInTime) / (1000*60*60);
  let hourRate = currentUser.salary / 30 / currentUser.hours;
  let dailySalary = (hoursWorked * hourRate).toFixed(2);

  records.push({
    date: new Date().toLocaleDateString("ar-EG"),
    in: checkInTime.toLocaleTimeString("ar-EG"),
    out: checkOutTime.toLocaleTimeString("ar-EG"),
    hours: hoursWorked.toFixed(2),
    value: dailySalary,
    leave: "",
    loan: "",
    deduction: ""
  });
  saveData();
  renderTable();
  checkInTime = null;
  checkedIn = false;
  alert("✅ انصراف: " + checkOutTime.toLocaleTimeString("ar-EG"));
}

function addLeave(type) {
  if (type === "مدفوعة") {
    if (paidLeaves >= 4) { alert("❌ استنفذت رصيد الإجازات المدفوعة."); return; }
    paidLeaves++;
    records.push({ date:new Date().toLocaleDateString("ar-EG"), in:"-", out:"-", hours:"0", value:(currentUser.salary/30).toFixed(2), leave:type, loan:"", deduction:"" });
  } else {
    records.push({ date:new Date().toLocaleDateString("ar-EG"), in:"-", out:"-", hours:"0", value:"0", leave:type, loan:"", deduction:"" });
  }
  saveData(); renderTable();
  alert("✅ تم إضافة إجازة " + type);
}

function addLoan() {
  let loan = prompt("أدخل قيمة السُلفة:");
  if (loan && loan > 0) { 
    records.push({ date:new Date().toLocaleDateString("ar-EG"), in:"-", out:"-", hours:"0", value:"0", leave:"", loan:loan, deduction:"" }); 
    saveData(); 
    renderTable(); 
    alert("✅ تم إضافة سُلفة: " + loan + " جنيه");
  }
}

function addDeduction() {
  let deduction = prompt("أدخل قيمة الخصم:");
  if (deduction && deduction > 0) { 
    records.push({ date:new Date().toLocaleDateString("ar-EG"), in:"-", out:"-", hours:"0", value:"0", leave:"", loan:"", deduction:deduction }); 
    saveData(); 
    renderTable(); 
    alert("✅ تم إضافة خصم: " + deduction + " جنيه");
  }
}

function resetMonth() {
  if (confirm("⚠️ هل أنت متأكد أنك تريد إعادة تسجيل الشهر من جديد؟ سيتم مسح كل البيانات!")) {
    records = [];
    paidLeaves = 0;
    localStorage.removeItem("attendance");
    renderTable();
    alert("✅ تم إعادة الشهر بنجاح!");
  }
}

function logout() {
  if (confirm("هل أنت متأكد من تسجيل الخروج؟")) {
    localStorage.removeItem("loggedUser");
    alert("👋 تم تسجيل الخروج بنجاح!");
    window.location.href = "login.html";
  }
}

function renderTable() {
  let table = document.getElementById("attendanceTable");
  table.innerHTML = `<tr>
    <th>التاريخ</th><th>الدخول</th><th>الخروج</th><th>الساعات</th><th>القيمة</th>
  </tr>`;
  let total = 0;
  records.forEach(r => {
    table.innerHTML += `<tr>
      <td>${r.date}</td><td>${r.in}</td><td>${r.out}</td><td>${r.hours}</td><td>${r.value}</td>
    </tr>`;
    total += parseFloat(r.value) || 0;
  });
  
  let loans = records.reduce((sum, r) => sum + (parseFloat(r.loan) || 0), 0);
  let deductions = records.reduce((sum, r) => sum + (parseFloat(r.deduction) || 0), 0);
  let finalTotal = total - loans - deductions;
  
  document.getElementById("totalValue").innerHTML = finalTotal.toFixed(2) + " <small>جنيه</small>";
  document.getElementById("summaryDetails").innerHTML = `الراتب: ${total.toFixed(2)} جنيه<br>السُلف: ${loans.toFixed(2)} جنيه<br>الخصومات: ${deductions.toFixed(2)} جنيه`;
}

renderTable();
</script>
</body>
</html>
