<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الحضور والانصراف</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #333;
      padding-bottom: 80px;
    }

    .container {
      max-width: 600px;
      width: 95%;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .greeting {
      font-size: 16px;
      font-weight: 600;
      color: #667eea;
    }

    .date-time {
      font-size: 13px;
      color: #666;
      text-align: center;
      flex-basis: 100%;
    }

    h1 {
      text-align: center;
      color: #fff;
      font-size: 28px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .salary-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .salary-label {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .salary-value {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border-left: 4px solid #4caf50;
      display: none;
    }

    .status-card.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    .status-card.checked-in {
      border-left-color: #4caf50;
      background: #f1f8f5;
    }

    .status-card.checked-out {
      border-left-color: #f44336;
      background: #fff3f1;
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .status-time {
      font-size: 13px;
      color: #666;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .buttons-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .buttons-container-full {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 15px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-success {
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
    }

    .btn-danger {
      background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
    }

    .btn-info {
      background: linear-gradient(135deg, #2196f3 0%, #0b7dda 100%);
    }

    .btn-warning {
      background: linear-gradient(135deg, #ff9800 0%, #e68900 100%);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #607d8b 0%, #455a64 100%);
    }

    .btn-dark {
      background: linear-gradient(135deg, #424242 0%, #212121 100%);
    }

    .btn-home {
      background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
    }

    .table-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      overflow-x: auto;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      background: #667eea;
      color: #fff;
      padding: 12px 8px;
      text-align: center;
      font-weight: 600;
      font-size: 11px;
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid #e0e0e0;
      text-align: center;
      font-size: 11px;
    }

    tr:hover {
      background: #f5f5f5;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .summary-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .summary-label {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .summary-value {
      font-size: 32px;
      font-weight: 700;
      color: #4caf50;
      margin-bottom: 10px;
    }

    .summary-details {
      font-size: 12px;
      color: #999;
      line-height: 1.8;
    }

    .footer {
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      font-size: 12px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    /* زر الواتساب العائم */
    .whatsapp-btn {
      position: fixed;
      bottom: 30px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #25d366 0%, #1faa51 100%);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      transition: all 0.3s ease;
      z-index: 999;
      text-decoration: none;
    }

    .whatsapp-btn:hover {
      transform: scale(1.15) translateY(-5px);
      box-shadow: 0 8px 30px rgba(37, 211, 102, 0.6);
    }

    .whatsapp-btn:active {
      transform: scale(0.95);
    }

    .whatsapp-tooltip {
      position: fixed;
      bottom: 100px;
      right: 20px;
      background: #25d366;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      z-index: 998;
    }

    .whatsapp-btn:hover ~ .whatsapp-tooltip,
    .whatsapp-tooltip:hover {
      opacity: 1;
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
        margin-bottom: 15px;
      }

      .header-content {
        flex-direction: column;
        gap: 10px;
      }

      .greeting {
        font-size: 14px;
      }

      .salary-value {
        font-size: 28px;
      }

      .btn {
        padding: 12px;
        font-size: 13px;
        min-height: 45px;
      }

      table {
        font-size: 10px;
      }

      th {
        padding: 10px 6px;
        font-size: 9px;
      }

      td {
        padding: 8px 5px;
        font-size: 10px;
      }

      .summary-value {
        font-size: 28px;
      }

      .whatsapp-btn {
        width: 55px;
        height: 55px;
        font-size: 28px;
        bottom: 25px;
        right: 15px;
      }

      .whatsapp-tooltip {
        bottom: 90px;
        right: 15px;
        font-size: 12px;
        padding: 8px 12px;
      }
    }

    @media (max-width: 360px) {
      .container {
        padding: 15px;
      }

      .header {
        padding: 15px;
      }

      h1 {
        font-size: 20px;
      }

      .btn {
        padding: 10px;
        font-size: 12px;
        min-height: 42px;
      }

      .salary-value {
        font-size: 24px;
      }

      .summary-value {
        font-size: 24px;
      }

      .whatsapp-btn {
        width: 50px;
        height: 50px;
        font-size: 24px;
        bottom: 20px;
        right: 12px;
      }

      .whatsapp-tooltip {
        bottom: 80px;
        right: 12px;
        font-size: 11px;
        padding: 7px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <span class="greeting" id="greeting"></span>
        <span class="date-time" id="dateTime"></span>
      </div>
    </div>

    <h1>📌 نظام الحضور والانصراف</h1>

    <div class="salary-card">
      <div class="salary-label">💰 مرتبك الشهري</div>
      <div class="salary-value"><span id="userSalary"></span> جنيه</div>
    </div>

    <div id="statusCard" class="status-card">
      <div class="status-text" id="statusText"></div>
      <div class="status-time" id="statusTime"></div>
    </div>

    <div class="buttons-container">
      <button class="btn btn-success" onclick="checkIn()">✅ حضور</button>
      <button class="btn btn-danger" onclick="checkOut()">⛔ انصراف</button>
      <button class="btn btn-info" onclick="addLeave('مدفوعة')">🎉 إجازة مدفوعة</button>
      <button class="btn btn-warning" onclick="addLeave('غير مدفوعة')">📅 إجازة بدون راتب</button>
    </div>

    <div class="buttons-container">
      <button class="btn btn-secondary" onclick="addLoan()">💳 إضافة سُلفة</button>
      <button class="btn btn-secondary" onclick="addDeduction()">📉 إضافة خصم</button>
    </div>

    <div class="buttons-container-full">
      <button class="btn btn-warning" onclick="resetMonth()">🔄 إعادة تسجيل الشهر</button>
    </div>

    <div class="table-container">
      <table id="attendanceTable">
        <tr>
          <th>التاريخ</th>
          <th>الدخول</th>
          <th>الخروج</th>
          <th>الساعات</th>
          <th>القيمة</th>
          <th>النوع</th>
        </tr>
      </table>
    </div>

    <div class="summary-card">
      <div class="summary-label">📊 ملخص الراتب الشهري</div>
      <div class="summary-value" id="totalValue">0</div>
      <div class="summary-details" id="summaryDetails">الراتب المكتسب: 0 جنيه<br>السُلف: 0 جنيه<br>الخصومات: 0 جنيه<br>الرصيد النهائي: 0 جنيه</div>
    </div>

    <div class="buttons-container-full">
      <button class="btn btn-dark" onclick="logout()">🚪 تسجيل الخروج</button>
      <button class="btn btn-home" onclick="window.location.href='index.html'">🏠 الصفحة الرئيسية</button>
    </div>

    <div class="footer">
      تم التطوير بواسطة: <strong>أحمد حاتم عبد العظيم</strong><br>
      📞 01102975929 – ✉️ ahmadhatem973@gmail.com
    </div>
  </div>

  <!-- زر الواتساب العائم -->
  <a href="https://wa.me/201102975929?text=مرحباً أحمد، أنا بحاجة للمساعدة" class="whatsapp-btn" target="_blank" title="تواصل معنا عبر الواتساب">
    💬
  </a>
  <div class="whatsapp-tooltip">تواصل معنا</div>

<script>
// ✅ النظام الجديد: تسجيل فوري بدون انتظار
let currentUser = null;
let records = JSON.parse(localStorage.getItem("attendance")) || [];
let dailyRecords = {}; // لتسجيل الحضور والانصراف لكل يوم

// تحميل بيانات المستخدم - تم التصحيح للحفظ الدائم ومنع مسح الحضور
function loadCurrentUser() {
  // قراءة البيانات من الـ localStorage الدائمة أولاً بدلاً من الـ sessionStorage المؤقتة
  currentUser = JSON.parse(localStorage.getItem("loggedUser"));
  
  if (!currentUser) {
    currentUser = JSON.parse(sessionStorage.getItem("loggedUser"));
  }
  
  if (currentUser) {
    // الاحتفاظ بها في الذاكرتين معاً لضمان عدم ضياع الجلسة عند الخروج والعودة
    localStorage.setItem("loggedUser", JSON.stringify(currentUser));
    sessionStorage.setItem("loggedUser", JSON.stringify(currentUser));
  } else {
    alert("⚠️ لم يتم العثور على بيانات المستخدم، برجاء تسجيل الدخول أولًا!");
    window.location.href = "login.html";
    return false;
  }
  return true;
}

if (!loadCurrentUser()) {
  throw new Error("لم يتم تحميل بيانات المستخدم");
}

// التأكد من وجود العنصر في صفحتك قبل طباعة الراتب تجنباً لأي توقف برمجى
const userSalaryEl = document.getElementById("userSalary");
if (userSalaryEl) {
  userSalaryEl.innerText = currentUser.salary;
}


// تحديث التحية والوقت
function updateHeader() {
  let now = new Date();
  let days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  let greeting = now.getHours() < 12 ? "☀️ صباح الخير" : (now.getHours() < 17 ? "🌤️ بعد الظهر" : "🌙 مساء الخير");
  document.getElementById("greeting").innerText = greeting + " يا " + currentUser.name;
  document.getElementById("dateTime").innerText =
    `${days[now.getDay()]} - ${now.toLocaleDateString("ar-EG")} - ${now.toLocaleTimeString("ar-EG")}`;
}
updateHeader();
setInterval(updateHeader, 60000);

function saveData() {
  localStorage.setItem("attendance", JSON.stringify(records));
  sessionStorage.setItem("attendance", JSON.stringify(records));
}

function getTodayKey() {
  return new Date().toLocaleDateString("ar-EG");
}

function showStatus(message, type) {
  const statusCard = document.getElementById("statusCard");
  const statusText = document.getElementById("statusText");
  const statusTime = document.getElementById("statusTime");
  
  statusText.textContent = message;
  statusTime.textContent = new Date().toLocaleTimeString("ar-EG");
  statusCard.className = "status-card show " + type;
  
  setTimeout(() => {
    statusCard.classList.remove("show");
  }, 4000);
}

function checkIn() {
  const today = getTodayKey();
  const now = new Date();
  const timeStr = now.toLocaleTimeString("ar-EG");
  
  // تحقق إذا كان هناك تسجيل حضور اليوم بالفعل
  if (dailyRecords[today] && dailyRecords[today].checkIn) {
    alert("❌ لقد سجلت حضورك اليوم بالفعل!\nالوقت: " + dailyRecords[today].checkIn.time);
    return;
  }
  
  // إذا لم يكن هناك سجل لليوم، أنشئ واحد جديد
  if (!dailyRecords[today]) {
    dailyRecords[today] = {};
  }
  
  // سجل وقت الحضور
  dailyRecords[today].checkIn = {
    time: timeStr,
    timestamp: now.getTime()
  };
  
  // أضف سجل مؤقت في الجدول
  records.push({
    date: today,
    in: timeStr,
    out: "-",
    hours: "-",
    value: "-",
    type: "عمل",
    loan: "",
    deduction: ""
  });
  
  saveData();
  renderTable();
  showStatus("✅ تم تسجيل الحضور بنجاح", "checked-in");
  alert("✅ حضور: " + timeStr);
}

function checkOut() {
  const today = getTodayKey();
  const now = new Date();
  const timeStr = now.toLocaleTimeString("ar-EG");
  
  // تحقق من وجود حضور لليوم
  if (!dailyRecords[today] || !dailyRecords[today].checkIn) {
    alert("❌ لم تسجل حضورك بعد! يجب تسجيل الحضور أولاً");
    return;
  }
  
  // تحقق إذا كان قد تم تسجيل انصراف بالفعل
  if (dailyRecords[today].checkOut) {
    alert("❌ لقد سجلت انصرافك بالفعل!\nالوقت: " + dailyRecords[today].checkOut.time);
    return;
  }
  
  // سجل وقت الانصراف
  const checkInTime = dailyRecords[today].checkIn.timestamp;
  const checkOutTime = now.getTime();
  const hoursWorked = (checkOutTime - checkInTime) / (1000 * 60 * 60);
  
  // حساب قيمة اليوم
  const hourRate = currentUser.salary / 30 / currentUser.hours;
  const dailySalary = (hoursWorked * hourRate).toFixed(2);
  
  dailyRecords[today].checkOut = {
    time: timeStr,
    timestamp: checkOutTime,
    hours: hoursWorked.toFixed(2),
    salary: dailySalary
  };
  
  // حدث آخر سجل (الحضور) بالانصراف والحساب
  let lastRecord = records[records.length - 1];
  if (lastRecord && lastRecord.date === today && lastRecord.out === "-") {
    lastRecord.out = timeStr;
    lastRecord.hours = hoursWorked.toFixed(2);
    lastRecord.value = dailySalary;
  }
  
  saveData();
  renderTable();
  showStatus("✅ تم تسجيل الانصراف بنجاح", "checked-out");
  alert("✅ انصراف: " + timeStr + "\n⏰ ساعات العمل: " + hoursWorked.toFixed(2) + "\n💰 قيمة اليوم: " + dailySalary + " جنيه");
}

function addLeave(type) {
  const today = getTodayKey();
  
  // تحقق إذا كان هناك سجل عمل اليوم
  if (dailyRecords[today] && (dailyRecords[today].checkIn || dailyRecords[today].checkOut)) {
    alert("❌ لا يمكن إضافة إجازة في يوم مسجل عمل!");
    return;
  }
  
  const leaveValue = type === "مدفوعة" ? currentUser.salary / 30 : 0;
  
  records.push({
    date: today,
    in: "-",
    out: "-",
    hours: "إجازة",
    value: leaveValue.toFixed(2),
    type: type,
    loan: "",
    deduction: ""
  });
  
  saveData();
  renderTable();
  alert("✅ تم إضافة إجازة " + type);
}

function addLoan() {
  const loan = prompt("أدخل قيمة السُلفة:");
  if (loan && loan > 0) {
    records.push({
      date: new Date().toLocaleDateString("ar-EG"),
      in: "-",
      out: "-",
      hours: "-",
      value: "-",
      type: "سُلفة",
      loan: loan,
      deduction: ""
    });
    saveData();
    renderTable();
    alert("✅ تم إضافة سُلفة: " + loan + " جنيه");
  }
}

function addDeduction() {
  const deduction = prompt("أدخل قيمة الخصم:");
  if (deduction && deduction > 0) {
    records.push({
      date: new Date().toLocaleDateString("ar-EG"),
      in: "-",
      out: "-",
      hours: "-",
      value: "-",
      type: "خصم",
      loan: "",
      deduction: deduction
    });
    saveData();
    renderTable();
    alert("✅ تم إضافة خصم: " + deduction + " جنيه");
  }
}

function resetMonth() {
  if (confirm("⚠️ هل أنت متأكد أنك تريد إعادة تسجيل الشهر من جديد؟ سيتم مسح كل البيانات!")) {
    records = [];
    dailyRecords = {};
    localStorage.removeItem("attendance");
    sessionStorage.removeItem("attendance");
    renderTable();
    alert("✅ تم إعادة الشهر بنجاح!");
  }
}

function logout() {
  if (confirm("هل أنت متأكد من تسجيل الخروج؟")) {
    localStorage.removeItem("loggedUser");
    sessionStorage.removeItem("loggedUser");
    alert("👋 تم تسجيل الخروج بنجاح!");
    window.location.href = "login.html";
  }
}

function renderTable() {
  let table = document.getElementById("attendanceTable");
  table.innerHTML = `<tr>
    <th>التاريخ</th><th>الدخول</th><th>الخروج</th><th>الساعات</th><th>القيمة</th><th>النوع</th>
  </tr>`;
  
  let total = 0;
  let loans = 0;
  let deductions = 0;
  
  records.forEach(r => {
    const value = parseFloat(r.value) || 0;
    const loanVal = parseFloat(r.loan) || 0;
    const deductVal = parseFloat(r.deduction) || 0;
    
    total += value;
    loans += loanVal;
    deductions += deductVal;
    
    table.innerHTML += `<tr>
      <td>${r.date}</td>
      <td>${r.in}</td>
      <td>${r.out}</td>
      <td>${r.hours}</td>
      <td>${r.value}</td>
      <td>${r.type}</td>
    </tr>`;
  });
  
  const finalTotal = total - loans - deductions;
  
  document.getElementById("totalValue").innerHTML = finalTotal.toFixed(2) + " <small>جنيه</small>";
  document.getElementById("summaryDetails").innerHTML = 
    `الراتب المكتسب: ${total.toFixed(2)} جنيه<br>` +
    `السُلف: ${loans.toFixed(2)} جنيه<br>` +
    `الخصومات: ${deductions.toFixed(2)} جنيه<br>` +
    `<strong style="color: #2196f3;">الرصيد النهائي: ${finalTotal.toFixed(2)} جنيه</strong>`;
}

renderTable();
