<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام الحضور والانصراف</title>
  <style>
    body { font-family:'Tahoma'; text-align:center; background:linear-gradient(135deg,#4a148c,#2196f3); color:#fff; margin:0; padding:20px; }
    #headerBar { display:flex; justify-content:space-between; padding:10px 20px; font-weight:bold; }
    h1 { font-size:26px; margin-bottom:10px; }
    p { font-size:16px; margin-bottom:20px; }
    button { display:block; width:90%; max-width:300px; margin:10px auto; padding:12px; font-size:16px; border:none; border-radius:8px; cursor:pointer; }
    #checkinBtn { background:#4caf50; color:#fff; }
    #checkoutBtn { background:#f44336; color:#fff; }
    #loanBtn { background:#607d8b; color:#fff; }
    #deductionBtn { background:#9e9e9e; color:#000; }
    #paidLeaveBtn { background:#2196f3; color:#fff; }
    #unpaidLeaveBtn { background:#9c27b0; color:#fff; }
    #resetBtn { background:#ff9800; color:#fff; }
    #logoutBtn { background:#424242; color:#fff; }
    table { border-collapse:collapse; width:95%; margin:20px auto; background:#fff; color:#000; border-radius:8px; }
    th, td { border:1px solid #ccc; padding:10px; text-align:center; }
    th { background:#eee; }
    #summary { margin-top:20px; font-size:18px; }
    footer { margin-top:30px; font-size:14px; color:#fff; }
  </style>
</head>
<body>
  <div id="headerBar">
    <span id="greeting"></span>
    <span id="dateTime"></span>
  </div>

  <h1>📌 نظام الحضور والانصراف</h1>
  <p>💰 مرتبك: <span id="userSalary"></span> جنيه</p>

  <button id="checkinBtn" onclick="checkIn()">حضور</button>
  <button id="checkoutBtn" onclick="checkOut()">انصراف</button>
  <button id="paidLeaveBtn" onclick="addLeave('مدفوعة')">إجازة مدفوعة الأجر</button>
  <button id="unpaidLeaveBtn" onclick="addLeave('غير مدفوعة')">إجازة بدون مرتب</button>
  <button id="loanBtn" onclick="addLoan()">إضافة سُلفة</button>
  <button id="deductionBtn" onclick="addDeduction()">إضافة خصم</button>
  <button id="resetBtn" onclick="resetMonth()">إعادة تسجيل الشهر</button>
  <button id="logoutBtn" onclick="logout()">تسجيل الخروج من الحساب</button>

  <table id="attendanceTable">
    <tr>
      <th>التاريخ</th>
      <th>وقت الدخول</th>
      <th>وقت الخروج</th>
      <th>عدد الساعات</th>
      <th>قيمة اليوم</th>
      <th>نوع الإجازة</th>
      <th>السُلفة</th>
      <th>الخصم</th>
    </tr>
  </table>

  <h2 id="summary">ملخص المرتب الشهري: 0 جنيه</h2>

  <footer>
    تم التطوير بواسطة: أحمد حاتم عبد العظيم<br>
    📞 01102975929 – ✉️ ahmadhatem973@gmail.com
  </footer>

<script>
let currentUser = JSON.parse(localStorage.getItem("loggedUser"));
let records = JSON.parse(localStorage.getItem("attendance")) || [];
let checkInTime = null;
let paidLeaves = 0;
let checkedIn = false;

if (!currentUser) {
  alert("⚠️ لم يتم العثور على بيانات المستخدم، برجاء تسجيل الدخول أولًا!");
  window.location.href = "login.html";
}

document.getElementById("userSalary").innerText = currentUser.salary;

// تحديث التحية والوقت
function updateHeader() {
  let now = new Date();
  let days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  let greeting = now.getHours() < 12 ? "☀️ صباح الخير يا " : "🌙 مساء الخير يا ";
  document.getElementById("greeting").innerText = greeting + currentUser.name;
  document.getElementById("dateTime").innerText =
    `${days[now.getDay()]} - ${now.toLocaleDateString("ar-EG")} - ${now.toLocaleTimeString("ar-EG")}`;
}
updateHeader();
setInterval(updateHeader, 60000);

function saveData() {
  localStorage.setItem("attendance", JSON.stringify(records));
}

function checkIn() {
  if (checkedIn) { alert("❌ لازم تعمل انصراف قبل حضور جديد."); return; }
  checkInTime = new Date();
  checkedIn = true;
  alert("✅ حضور: " + checkInTime.toLocaleTimeString("ar-EG"));
}

function checkOut() {
  if (!checkedIn) { alert("❌ لازم تسجل حضور الأول."); return; }
  let checkOutTime = new Date();
  let hoursWorked = (checkOutTime - checkInTime) / (1000*60*60);
  let hourRate = currentUser.salary / 30 / currentUser.hours;
  let dailySalary = (hoursWorked * hourRate).toFixed(2);

  records.push({
    date: new Date().toLocaleDateString("ar-EG"),
    in: checkInTime.toLocaleTimeString("ar-EG"),
    out: checkOutTime.toLocaleTimeString("ar-EG"),
    hours: hoursWorked.toFixed(2),
    value: dailySalary,
    leave: "",
    loan: "",
    deduction: ""
  });
  saveData();
  renderTable();
  checkInTime = null;
  checkedIn = false;
}

function addLeave(type) {
  if (type === "مدفوعة") {
    if (paidLeaves >= 4) { alert("❌ استنفذت رصيد الإجازات المدفوعة."); return; }
    paidLeaves++;
    records.push({ date:new Date().toLocaleDateString("ar-EG"), in:"-", out:"-", hours:"0", value:(currentUser.salary/30).toFixed(2), leave:type, loan:"", deduction:"" });
  } else {
    records.push({ date:new Date().toLocaleDateString("ar-EG"), in:"-", out:"-", hours:"0", value:"0", leave:type, loan:"", deduction:"" });
  }
  saveData(); renderTable();
}

function addLoan() {
  let loan = prompt("أدخل قيمة السُلفة:");
  if (loan) { records.push({ date:new Date().toLocaleDateString("ar-EG"), in:"-", out:"-", hours:"0", value:"0", leave:"", loan:loan, deduction:"" }); saveData(); renderTable(); }
}

function addDeduction() {
  let deduction = prompt("أدخل قيمة الخصم:");
  if (deduction) { records.push({ date:new Date().toLocaleDateString("ar-EG"), in:"-", out:"-", hours:"0", value:"0", leave:"", loan:"", deduction:deduction }); saveData(); renderTable(); }
}

// ✅ زر إعادة الشهر مع تأكيد
function resetMonth() {
  if (confirm("⚠️ هل أنت متأكد أنك تريد إعادة تسجيل الشهر من جديد؟ سيتم مسح كل البيانات!")) {
    records = [];
    paidLeaves = 0;
    localStorage.removeItem("attendance");
    renderTable();
    alert("✅ تم إعادة الشهر بنجاح!");
  }
}

function logout() {
  localStorage.removeItem("loggedUser");
  window.location.href = "login.html";
}

function renderTable() {
  let table = document.getElementById("attendanceTable");
  table.innerHTML = `<tr>
    <th>التاريخ</th><th>وقت الدخول</th><th>وقت الخروج</th><th>عدد الساعات</th><th>قيمة اليوم</th><th>نوع الإجازة</th><th>السُلفة</th><th>الخصم</th>
  </tr>`;
  let total = 0;
  records.forEach(r => {
    table.innerHTML += `<tr>
      <td>${r.date}</td><td>${r.in}</td><td>${r.out}</td><td>${r.hours}</td><td>${r.value}</td><td>${r.leave}</td><td>${r.loan}</td><td>${r.deduction}</td>
    </tr>`;
    total += parseFloat(r.value
