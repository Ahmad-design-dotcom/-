<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام الحضور والانصراف</title>
  <style>
    body { font-family: 'Tahoma', sans-serif; direction: rtl; text-align: right; background:#f4f6f9; margin:0; }
    h1 { color:#4a148c; text-align:center; padding:20px; }
    button { margin:5px; padding:10px 15px; border:none; border-radius:5px; cursor:pointer; font-size:14px; }
    button:hover { opacity:0.85; }
    input { margin:5px; padding:8px; border:1px solid #ccc; border-radius:5px; }
    table { border-collapse: collapse; width:95%; margin:20px auto; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    th, td { border:1px solid #ccc; padding:10px; text-align:center; }
    th { background:#eee; }
    #summary { text-align:center; margin:20px; color:#333; }
    footer { background:#222; color:#fff; text-align:center; padding:15px; margin-top:30px; font-size:14px; }
    footer a { color:#4caf50; text-decoration:none; }
    #loginScreen, #registerScreen { text-align:center; padding:50px; }
    #mainApp { display:none; }
  </style>
</head>
<body>

<div id="registerScreen">
  <h1>📝 إنشاء حساب جديد</h1>
  <input type="text" id="regName" placeholder="الاسم الكامل"><br>
  <input type="text" id="regPhone" placeholder="رقم الهاتف"><br>
  <input type="email" id="regEmail" placeholder="البريد الإلكتروني"><br>
  <input type="password" id="regPassword" placeholder="كلمة السر"><br><br>
  <button onclick="register()">إنشاء الحساب</button>
</div>

<div id="loginScreen" style="display:none;">
  <h1>🔐 تسجيل دخول</h1>
  <input type="text" id="loginName" placeholder="الاسم"><br>
  <input type="password" id="loginPassword" placeholder="كلمة السر"><br><br>
  <button onclick="login()">دخول</button>
</div>

<div id="mainApp">
  <h1>📌 نظام الحضور والانصراف</h1>

  <div style="text-align:center;">
    <label>💰 المرتب الشهري: <input type="number" id="monthlySalary" value="6000"></label><br><br>
    <button onclick="checkIn()">تسجيل دخول</button>
    <button onclick="checkOut()">تسجيل خروج</button>
    <button onclick="addLeave('مدفوعة')">إجازة مدفوعة</button>
    <button onclick="addLeave('غير مدفوعة')">إجازة غير مدفوعة</button>
    <button onclick="addLoan()">إضافة سُلفة</button>
    <button onclick="addDeduction()">إضافة خصم</button>
    <button onclick="resetMonth()">إعادة الشهر</button>
  </div>

  <table id="attendanceTable">
    <tr>
      <th>التاريخ</th>
      <th>وقت الدخول</th>
      <th>وقت الخروج</th>
      <th>عدد الساعات</th>
      <th>قيمة اليوم</th>
      <th>نوع الإجازة</th>
      <th>السُلفة</th>
      <th>الخصم</th>
    </tr>
  </table>

  <h2 id="summary">ملخص المرتب الشهري: 0 جنيه</h2>

  <footer>
    👨‍💻 المطور: أحمد حاتم عبدالعظيم | 📞 <a href="tel:01102975929">01102975929</a> | ✉️ <a href="mailto:ahmadhatem973@gmail.com">ahmadhatem973@gmail.com</a>
  </footer>
</div>

<script>
let records = JSON.parse(localStorage.getItem("attendance")) || [];
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = null;
let checkInTime = null;
let paidLeaves = 0;

function saveData() {
  localStorage.setItem("attendance", JSON.stringify(records));
}

function register() {
  let name = document.getElementById("regName").value;
  let phone = document.getElementById("regPhone").value;
  let email = document.getElementById("regEmail").value;
  let password = document.getElementById("regPassword").value;

  users.push({name, phone, email, password});
  localStorage.setItem("users", JSON.stringify(users));
  alert("✅ تم إنشاء الحساب بنجاح!");
  document.getElementById("registerScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
}

function login() {
  let name = document.getElementById("loginName").value;
  let password = document.getElementById("loginPassword").value;

  let user = users.find(u => u.name === name && u.password === password);
  if (user) {
    currentUser = user;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
  } else {
    alert("❌ بيانات الدخول غير صحيحة!");
  }
}

function checkIn() {
  checkInTime = new Date();
  alert("تم تسجيل الدخول: " + checkInTime.toLocaleString("ar-EG"));
}

function checkOut() {
  if (!checkInTime) { alert("لازم تسجل دخول الأول"); return; }
  let checkOutTime = new Date();
  let hours = (checkOutTime - checkInTime) / (1000*60*60);

  let salary = document.getElementById("monthlySalary").value;
  let hourRate = (salary / 30 / 12).toFixed(2);
  let dailySalary = (hours * hourRate).toFixed(2);

  records.push({
    date: new Date().toLocaleDateString("ar-EG"),
    in: checkInTime.toLocaleTimeString("ar-EG"),
    out: checkOutTime.toLocaleTimeString("ar-EG"),
    hours: hours.toFixed(2),
    value: dailySalary,
    leave: "",
    loan: "",
    deduction: ""
  });

  checkInTime = null;
  renderTable();
  saveData();
}

function addLeave(type) {
  if (type === "مدفوعة") {
    if (paidLeaves >= 4) {
      alert("❌ تم نفاذ رصيد الإجازات المدفوعة لهذا الشهر!");
      return;
    }
    paidLeaves++;
  }

  let salary = document.getElementById("monthlySalary").value;
  let dailySalary = (salary / 30).toFixed(2);

  records.push({
    date: new Date().toLocaleDateString("ar-EG"),
    in: "-",
    out: "-",
    hours: "0",
    value: type === "مدفوعة" ? dailySalary : "0",
    leave: type,
    loan: "",
    deduction: ""
  });
  renderTable();
  saveData();
}

function addLoan() {
  let loan = prompt("أدخل قيمة السُلفة:");
  if (loan) {
    records.push({
      date: new Date().toLocaleDateString("ar-EG"),
      in: "-",
      out: "-",
      hours: "0",
      value: "0",
      leave: "",
      loan: loan,
      deduction: ""
    });
    renderTable();
    saveData();
  }
}

function addDeduction() {
  let deduction = prompt("أدخل قيمة الخصم:");
  if (deduction) {
    records.push({
      date: new Date().toLocaleDateString("ar-EG"),
      in: "-",
      out: "-",
      hours: "0",
      value: "0",
      leave: "",
      loan: "",
      deduction: deduction
    });
    renderTable();
    saveData();
  }
}

function resetMonth() {
  if (confirm("⚠️ هل أنت متأكد أنك تريد إعادة الشهر من جديد؟ سيتم مسح كل البيانات!")) {
    records = [];
    paidLeaves = 0;
    saveData();
    renderTable();
  }
}

function renderTable() {
  let table = document.getElementById("attendanceTable");
  table.innerHTML = `
    <tr>
      <th>التاريخ</th>
      <th>وقت الدخول</th>
      <th>وقت الخروج</th>
      <th>عدد الساعات</th>
      <th>قيمة اليوم</th>
      <th>نوع الإجازة
