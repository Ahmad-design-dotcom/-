<script>
let records = JSON.parse(localStorage.getItem("attendance")) || [];
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = null;
let checkInTime = null;
let paidLeaves = 0;

// لو في جلسة محفوظة
window.onload = function() {
  let savedUser = JSON.parse(localStorage.getItem("loggedUser"));
  if (savedUser) {
    currentUser = savedUser;
    showMainApp();
  }
};

function saveData() {
  localStorage.setItem("attendance", JSON.stringify(records));
}

// إنشاء حساب
function register() {
  let name = document.getElementById("regName").value;
  let phone = document.getElementById("regPhone").value;
  let email = document.getElementById("regEmail").value;
  let password = document.getElementById("regPassword").value;
  let salary = document.getElementById("regSalary").value;

  users.push({name, phone, email, password, salary});
  localStorage.setItem("users", JSON.stringify(users));
  alert("✅ تم إنشاء الحساب بنجاح!");

  // بعد الإنشاء يدخل مباشرة على شاشة تسجيل الدخول
  document.getElementById("registerScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
}

// زر "لدي حساب بالفعل"
function goToLogin() {
  document.getElementById("registerScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
}

// تسجيل دخول
function login() {
  let name = document.getElementById("loginName").value;
  let password = document.getElementById("loginPassword").value;
  let remember = document.getElementById("rememberMe").checked;

  let user = users.find(u => u.name === name && u.password === password);
  if (user) {
    currentUser = user;
    if (remember) localStorage.setItem("loggedUser", JSON.stringify(user));
    showMainApp();
  } else {
    alert("❌ بيانات الدخول غير صحيحة!");
  }
}

// تسجيل خروج من الحساب
function logout() {
  currentUser = null;
  localStorage.removeItem("loggedUser");
  document.getElementById("mainApp").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
}

// عرض التطبيق الرئيسي مع التحية والتاريخ
function showMainApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("registerScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  document.getElementById("userSalary").innerText = currentUser.salary || 0;

  let now = new Date();
  let hours = now.getHours();
  let greeting = hours < 12 ? "☀️ صباح الخير " : "🌙 مساء الخير ";
  document.getElementById("greeting").innerText = greeting + currentUser.name;

  let options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour:'2-digit', minute:'2-digit' };
  document.getElementById("dateTime").innerText = now.toLocaleDateString("ar-EG", options);
}

// حضور
function checkIn() {
  if (confirm("هل تريد تسجيل حضور الآن؟")) {
    checkInTime = new Date();
    alert("✅ تم تسجيل الحضور: " + checkInTime.toLocaleString("ar-EG"));
  }
}

// انصراف
function checkOut() {
  if (!checkInTime) { alert("لازم تسجل حضور الأول"); return; }
  if (confirm("هل تريد تسجيل انصراف الآن؟")) {
    let checkOutTime = new Date();
    let hours = (checkOutTime - checkInTime) / (1000*60*60);

    let salary = currentUser.salary || 0;
    let hourRate = (salary / 30 / 12).toFixed(2);
    let dailySalary = (hours * hourRate).toFixed(2);

    records.push({
      date: new Date().toLocaleDateString("ar-EG"),
      in: checkInTime.toLocaleTimeString("ar-EG"),
      out: checkOutTime.toLocaleTimeString("ar-EG"),
      hours: hours.toFixed(2),
      value: dailySalary,
      leave: "",
      loan: "",
      deduction: ""
    });

    checkInTime = null;
    renderTable();
    saveData();
  }
}
</script>
