<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام الحضور والانصراف</title>
  <style>
    body { font-family: 'Tahoma'; text-align:center; background:linear-gradient(135deg,#4a148c,#2196f3); color:#fff; margin:0; padding:40px 10px; }
    h1 { font-size:26px; margin-bottom:10px; }
    p { font-size:16px; margin-bottom:25px; }
    .btn { display:block; width:90%; max-width:300px; margin:10px auto; padding:12px; font-size:16px; border:none; border-radius:8px; cursor:pointer; }
    .btn-register { background:#4caf50; color:#fff; }
    .btn-login { background:#2196f3; color:#fff; }
    .btn-attendance { background:#9c27b0; color:#fff; }
  </style>
</head>
<body>
  <h1>👋 مرحبًا بك في نظام الحضور والانصراف</h1>
  <p>اختر الصفحة التي تريد الدخول إليها:</p>
  <button class="btn btn-register" onclick="window.location.href='register.html'">إنشاء حساب جديد</button>
  <button class="btn btn-login" onclick="window.location.href='login.html'">تسجيل دخول</button>
  <button class="btn btn-attendance" onclick="window.location.href='attendance.html'">صفحة الحضور والانصراف</button>
</body>
</html>
