<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل دخول</title>
  <style>
    body { font-family:'Tahoma'; text-align:center; background:linear-gradient(135deg,#4a148c,#2196f3); color:#fff; margin:0; padding:40px 10px; }
    h1 { font-size:26px; margin-bottom:10px; }
    input,button { display:block; width:90%; max-width:300px; margin:10px auto; padding:10px; border-radius:8px; border:none; }
    button { background:#2196f3; color:#fff; font-size:16px; cursor:pointer; }
    a { color:#fff; text-decoration:underline; }
  </style>
</head>
<body>
  <h1>🔐 تسجيل دخول</h1>
  <form onsubmit="login(); return false;">
    <input id="loginName" placeholder="الاسم" required>
    <input id="loginPassword" type="password" placeholder="كلمة السر" required>
    <button type="submit">دخول</button>
  </form>
  <a href="register.html">ليس لديك حساب؟ أنشئ حساب جديد</a>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];
function login() {
  let name = document.getElementById("loginName").value;
  let password = document.getElementById("loginPassword").value;
  let user = users.find(u => u.name === name && u.password === password);
  if (user) {
    localStorage.setItem("loggedUser", JSON.stringify(user));
    alert("✅ تسجيل الدخول ناجح!");
    window.location.href = "attendance.html";
  } else {
    alert("❌ بيانات الدخول غير صحيحة!");
  }
}
</script>
</body>
</html>
