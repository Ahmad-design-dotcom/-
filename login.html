<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 20px;
      padding: 40px 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header-icon {
      font-size: 56px;
      margin-bottom: 15px;
      animation: slideDown 0.6s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .subtitle {
      color: #999;
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      color: #555;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      transition: all 0.3s ease;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input::placeholder {
      color: #ccc;
    }

    .password-toggle {
      position: absolute;
      left: 15px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #667eea;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      width: 35px;
      height: 35px;
    }

    .password-toggle:hover {
      color: #764ba2;
      transform: scale(1.15);
    }

    input[type="password"],
    .password-group input {
      padding-left: 45px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      font-size: 14px;
      color: #666;
    }

    .remember-me input[type="checkbox"] {
      width: auto;
      min-width: 18px;
      padding: 0;
      border: 2px solid #e0e0e0;
      cursor: pointer;
      margin: 0;
    }

    .remember-me input[type="checkbox"]:checked {
      border-color: #667eea;
      background: #667eea;
    }

    .remember-me label {
      margin: 0;
      font-weight: 400;
      cursor: pointer;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 30px;
    }

    .btn {
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 55px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .btn-login {
      background: linear-gradient(135deg, #2196f3 0%, #0b7dda 100%);
      color: #fff;
    }

    .btn-home {
      background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
      color: #fff;
    }

    .btn-icon {
      font-size: 20px;
    }

    .alert {
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 22px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease;
      border-left: 4px solid;
    }

    .alert.error {
      background: #ffebee;
      color: #c62828;
      border-left-color: #f44336;
    }

    .alert.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left-color: #4caf50;
    }

    .alert.show {
      display: block;
    }

    .input-error {
      border-color: #f44336 !important;
      background: #fff5f5 !important;
    }

    .link-section {
      text-align: center;
      margin-top: 25px;
      padding-top: 22px;
      border-top: 2px solid #e0e0e0;
    }

    .link-text {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    .link-text a {
      color: #667eea;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .link-text a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn:disabled {
      opacity: 0.8;
      cursor: not-allowed;
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 8px;
      }

      .header-icon {
        font-size: 48px;
        margin-bottom: 12px;
      }

      .subtitle {
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        font-size: 13px;
        margin-bottom: 8px;
      }

      input {
        padding: 12px 14px;
        font-size: 14px;
        border-radius: 10px;
      }

      .password-toggle {
        width: 32px;
        height: 32px;
        font-size: 18px;
        left: 12px;
      }

      input[type="password"],
      .password-group input {
        padding-left: 42px;
      }

      .btn {
        padding: 14px;
        font-size: 15px;
        min-height: 50px;
        border-radius: 10px;
        gap: 8px;
      }

      .btn-icon {
        font-size: 18px;
      }

      .remember-me {
        margin: 15px 0;
        font-size: 13px;
      }

      .alert {
        padding: 12px 14px;
        font-size: 13px;
        margin-bottom: 18px;
        border-radius: 10px;
      }

      .link-section {
        margin-top: 20px;
        padding-top: 18px;
      }

      .link-text {
        font-size: 13px;
      }
    }

    @media (max-width: 360px) {
      .container {
        max-width: 100%;
      }

      .card {
        padding: 25px 15px;
        border-radius: 16px;
        margin: 10px;
      }

      h1 {
        font-size: 22px;
      }

      .header-icon {
        font-size: 40px;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 13px;
      }

      input {
        padding: 11px 12px;
        font-size: 13px;
        border-radius: 9px;
      }

      .btn {
        padding: 12px;
        font-size: 14px;
        min-height: 46px;
      }

      .remember-me {
        font-size: 12px;
        gap: 8px;
      }

      .remember-me input[type="checkbox"] {
        min-width: 16px;
      }

      .alert {
        padding: 10px 12px;
        font-size: 12px;
        margin-bottom: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="header-icon">🔐</div>
        <h1>تسجيل الدخول</h1>
        <p class="subtitle">أهلاً بك مجدداً!<br>سجل دخولك لمتابعة عملك</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="loginForm" onsubmit="login(); return false;">
        <div class="form-group">
          <label for="loginEmail">📧 البريد الإلكتروني أو الاسم</label>
          <div class="input-wrapper">
            <input 
              id="loginEmail" 
              type="text"
              placeholder="ادخل بريدك أو اسمك"
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group password-group">
          <label for="loginPassword">🔑 كلمة المرور</label>
          <div class="input-wrapper">
            <input 
              id="loginPassword" 
              type="password"
              placeholder="ادخل كلمة المرور"
              required
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')" title="اظهر/اخفي كلمة المرور">
              👁️
            </button>
          </div>
        </div>

        <div class="remember-me">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">تذكر بيانات الدخول</label>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-login" id="loginBtn">
            <span class="btn-icon">🚀</span>
            <span>دخول</span>
            <div class="loading-spinner" id="spinner"></div>
          </button>
          <button type="button" class="btn btn-home" onclick="goHome()">
            <span class="btn-icon">🏠</span>
            <span>الصفحة الرئيسية</span>
          </button>
        </div>
      </form>

      <div class="link-section">
        <p class="link-text">ليس لديك حساب؟<br>
          <a href="register.html">أنشئ حساب جديد الآن</a>
        </p>
      </div>
    </div>
  </div>

<script>
function togglePassword(fieldId) {
  const field = document.getElementById(fieldId);
  const type = field.type === 'password' ? 'text' : 'password';
  field.type = type;
}

function showAlert(message, type) {
  const alertBox = document.getElementById('alertBox');
  alertBox.textContent = message;
  alertBox.className = 'alert ' + type + ' show';
  
  if (type === 'error') {
    setTimeout(() => {
      alertBox.classList.remove('show');
    }, 5000);
  }
}

function goHome() {
  window.location.href = 'index.html';
}

function login() {
  const emailOrName = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const rememberMe = document.getElementById('rememberMe').checked;
  const loginBtn = document.getElementById('loginBtn');
  const spinner = document.getElementById('spinner');

  if (!emailOrName || !password) {
    showAlert('❌ يرجى ملء جميع الحقول', 'error');
    return;
  }

  // إظهار الـ spinner
  loginBtn.disabled = true;
  spinner.style.display = 'inline-block';

  // تأخير صغير لمحاكاة التحميل
  setTimeout(() => {
    let users = JSON.parse(localStorage.getItem("users")) || [];
    
    // البحث عن المستخدم باستخدام البريد أو الاسم
    let user = users.find(u => 
      (u.email === emailOrName || u.name === emailOrName) && u.password === password
    );

    if (user) {
      // حفظ بيانات المستخدم في localStorage
      localStorage.setItem("loggedUser", JSON.stringify(user));
      
      // إذا اختار "تذكرني" حفظ البيانات أيضاً
      if (rememberMe) {
        localStorage.setItem("rememberUser", JSON.stringify(user));
      } else {
        localStorage.removeItem("rememberUser");
      }

      showAlert('✅ تسجيل الدخول ناجح! جاري التحويل...', 'success');
      
      setTimeout(() => {
        window.location.href = "attendance.html";
      }, 2000);
    } else {
      showAlert('❌ بيانات الدخول غير صحيحة! تحقق من البريد والمرور', 'error');
      document.getElementById('loginEmail').classList.add('input-error');
      document.getElementById('loginPassword').classList.add('input-error');
      
      loginBtn.disabled = false;
      spinner.style.display = 'none';
    }
  }, 800);
}

// عند تحميل الصفحة، إذا كان هناك بيانات محفوظة
window.addEventListener('load', function() {
  let savedUser = JSON.parse(localStorage.getItem("rememberUser"));
  if (savedUser) {
    document.getElementById('loginEmail').value = savedUser.email || savedUser.name;
    document.getElementById('rememberMe').checked = true;
  }
});

// إزالة الخطأ عند بدء الكتابة
['loginEmail', 'loginPassword'].forEach(id => {
  document.getElementById(id).addEventListener('focus', function() {
    this.classList.remove('input-error');
  });

  document.getElementById(id).addEventListener('input', function() {
    this.classList.remove('input-error');
  });
});

// معالجة الضغط على Enter
document.getElementById('loginForm').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    login();
  }
});
</script>
</body>
</html>
